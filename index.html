try{localStorage.setItem(KEY,JSON.stringify(progress));}catch{storageWorks=false;$('storage-notice').classList.remove('hidden');}
function updateHeader(){$('total-points').textContent=progress.points.toLocaleString('tr-TR');$('mistake-count').textContent=progress.mistakes.length+progress.conceptMistakes.length;document.querySelectorAll('[data-nav]').forEach(b=>{const active=b.dataset.nav===page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
function shuffle(array){const out=[...array];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
const topicBy=id=>TOPICS.find(t=>t.id===id);
function introduction(title,description,eyebrow='SIRA SENDE',right='TYT / DKAB'){return `<section class="intro"><div><div class="eyebrow">${eyebrow}</div><h1 tabindex="-1">${title}</h1><p>${description}</p></div><span class="edition">${right}</span></section>`;}
function setView(html,focus=false){$('view').innerHTML=html;updateHeader();if(focus){$('view').querySelector('h1,h2')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
function goHome(){stopTimer();game=null;matching=null;page='home';renderHome();}
function renderHome(){const mastered=progress.mastered.filter(id=>PRACTICE.some(q=>q.id===id)).length;setView(`${introduction('TYT’ye doğru, birlikte.',`9–10. sınıf · ${PRACTICE.length} ünite + ${EXAMS.length} deneme sorusu · ${GLOSSARY.length} kavram`,'ABDULLAH ÇAM’LA','2026–2027 / TYT')}${featureCards()}<div class="workspace"><section class="panel setup"><div class="section-title"><span class="step">01</span><h2>Bugün hangi ünitedeyiz?</h2><small>${PRACTICE.length} özgün soru</small></div>${gradeFilters()}<button class="all-topic ${selectedTopic==='all'?'selected':''}" data-action="topic" data-topic="all" aria-pressed="${selectedTopic==='all'}"><span class="topic-symbol">${icon('layers')}</span><span><strong>Karışık tur</strong><small>Seçili sınıfın ünitelerinden dengeli 10 soru</small></span><span class="selection-dot" aria-hidden="true"></span></button><div class="topic-grid">${availableTopics().map(t=>`<button class="topic ${selectedTopic===t.id?'selected':''}" data-action="topic" data-topic="${t.id}" aria-pressed="${selectedTopic===t.id}"><span class="topic-symbol" style="background:${t.color}15;color:${t.color}">${icon(t.icon)}</span><span><strong>${t.title}</strong><small>${t.sub}</small><span class="unit-meta">${t.grade}. SINIF · ${t.unit}. ÜNİTE <b>${t.count} SORU</b></span></span><span class="selection-dot" aria-hidden="true"></span></button>`).join('')}</div><div class="mode-section"><div class="section-title"><span class="step">02</span><h2>Nasıl oynamak istersin?</h2></div><div class="mode-grid"><button class="mode ${selectedMode==='learn'?'selected':''}" data-action="mode" data-mode="learn" aria-pressed="${selectedMode==='learn'}">${icon('book')}<span><strong>Öğrenme turu</strong><small>Süresiz · Rahatça düşün</small></span></button><button class="mode ${selectedMode==='sprint'?'selected':''}" data-action="mode" data-mode="sprint" aria-pressed="${selectedMode==='sprint'}">${icon('spark')}<span><strong>Hızlı tur</strong><small>Her soru için 30 saniye</small></span></button></div></div><div class="start-row"><p class="start-meta"><strong>10 soru</strong> · 5 seçenek<br>Her yanıttan sonra açıklama<br>Önce çözmediğin sorular</p><button class="primary" data-action="start">Oyuna başla ${icon('arrow')}</button></div></section><aside class="rail"><section class="panel progress-panel"><div class="rail-heading">Senin rotan ${icon('chart')}</div><div class="progress-ring" style="--angle:${mastered/PRACTICE.length*360}deg"><div class="ring-center"><strong>${mastered}<span style="font-size:15px;color:#8a91a1;font-weight:450">/${PRACTICE.length}</span></strong><small>pekişen soru</small></div></div><p class="rail-caption">Son denemende doğru yanıtladığın<br>farklı sorular</p><div class="stat-grid"><div><strong>${progress.rounds}</strong><small>Tamamlanan tur</small></div><div><strong>${progress.answered?Math.round(progress.correct/progress.answered*100)+'%':'—'}</strong><small>Doğru oranı</small></div></div></section><section class="challenge"><div class="challenge-label">${icon('target')} KÜÇÜK BİR HEDEF</div><h3>5 doğruyu<br>art arda bul.</h3><p>Her doğru 100 puan.<br>3. doğrudan itibaren<br>+20 seri puanı kazan.</p><div class="challenge-bar" aria-hidden="true">${Array.from({length:5},(_,i)=>`<i class="${progress.bestStreak>i?'done':''}"></i>`).join('')}</div><small>En iyi serin: ${progress.bestStreak} doğru</small></section><p class="hint">${icon('shield')}<span>Hesap açmana gerek yok. Gelişimin yalnızca bu tarayıcıda saklanır.</span></p></aside></div>`);}
function unseenFirst(pool){return [...shuffle(pool.filter(q=>!progress.seen.includes(q.id))),...shuffle(pool.filter(q=>progress.seen.includes(q.id)))];}
function balancedQuestions(){const groups=shuffle(availableTopics()).map(t=>unseenFirst(PRACTICE.filter(q=>q.topic===t.id)));const out=[];while(out.length<10){for(const g of groups){if(g.length&&out.length<10)out.push(g.shift());}}return shuffle(out);}
function startGame(mode=selectedMode,topic=selectedTopic,ids=null){if(!['learn','sprint','review'].includes(mode)||!['all',...TOPICS.map(t=>t.id)].includes(topic))throw new Error('Geçersiz tur seçimi.');let pool=ids?shuffle(QUESTIONS.filter(q=>ids.includes(q.id))).slice(0,10):topic==='all'?balancedQuestions():unseenFirst(PRACTICE.filter(q=>q.topic===topic)).slice(0,10);if(!pool.length){showMistakes();return;}stopTimer();game={mode,topic,questions:pool.map(q=>({...q,choices:shuffle(q.options.map((text,i)=>({text,correct:i===0})))})),index:0,answers:[],points:0,streak:0,best:0,answered:false,finished:false,deadline:0,remaining:30,paused:false};matching=null;page='home';renderQuestion();}
function stopTimer(){if(timer!==null)clearInterval(timer);timer=null;}
function currentQuestion(){return game?.questions[game.index];}
function questionSource(q){return q.examDomain?'https://ogmmateryal.eba.gov.tr/yks-konu-anlatim?d=0&k=0&kod=DIN&s=0&u=0':topicBy(q.topic).source;}
function renderQuestion(){if(!game)return;stopTimer();game.answered=false;game.remaining=30;game.deadline=Date.now()+30000;const q=currentQuestion(),t=topicBy(q.topic);setView(`<div class="game-wrap animate-in"><div class="game-status"><button class="subtle-button" data-action="home">${icon('back')} Turdan çık</button><div class="game-chips"><span class="pill orange">${icon('spark')} <span id="round-points">${game.points}</span> puan</span><span class="pill" id="streak-chip">${icon('target')} <span id="round-streak">${game.streak}</span> seri</span>${game.mode==='sprint'?`<span class="pill" id="timer-chip">${icon('clock')} <span id="timer-value">30</span> sn</span>`:'<span class="pill">Süresiz</span>'}</div></div><section class="panel question-card"><div class="q-top"><span class="topic-tag">${t.title}</span><span>${game.mode==='review'?'Yanlışları pekiştir':game.mode==='sprint'?'Hızlı tur':'Öğrenme turu'}</span></div><div class="track" role="progressbar" aria-label="Tur ilerlemesi" aria-valuemin="0" aria-valuemax="${game.questions.length}" aria-valuenow="${game.index}"><div class="track-fill" style="width:${game.index/game.questions.length*100}%"></div></div><div class="question-kind">${q.kind}</div><div class="question-number">SORU ${String(game.index+1).padStart(2,'0')} <span style="color:#b8bdc8">/ ${String(game.questions.length).padStart(2,'0')}</span></div><h1 tabindex="-1">${esc(q.text)}</h1><div class="answers" role="group" aria-label="Cevap seçenekleri">${q.choices.map((choice,i)=>`<button class="answer" data-action="answer" data-index="${i}"><span class="answer-letter">${'ABCDE'[i]}</span><span>${esc(choice.text)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="question-footer"><p class="keyboard"><kbd>1</kbd>–<kbd>5</kbd> veya <kbd>A</kbd>–<kbd>E</kbd> ile yanıtla.<br>Açıklamadan sonra <kbd>Enter</kbd> ile ilerle.</p><button class="primary" id="next-button" data-action="next" disabled>${game.index+1===game.questions.length?'Sonucu gör':'Sonraki soru'} ${icon('arrow')}</button></div></section></div>`,true);if(game.mode==='sprint')timer=setInterval(tick,200);}
function tick(){if(!game||game.mode!=='sprint'||game.answered||game.paused)return;const remaining=Math.max(0,Math.ceil((game.deadline-Date.now())/1000));game.remaining=remaining;if($('timer-value'))$('timer-value').textContent=remaining;$('timer-chip')?.classList.toggle('timer-low',remaining<=8);if(remaining===0)answer(-1);}
function answer(index){if(!game||game.answered||game.finished||game.paused)return;if(!Number.isInteger(index)||index< -1||index>4)return;if(game.mode==='sprint'&&Date.now()>=game.deadline)index=-1;stopTimer();game.answered=true;const q=currentQuestion();const correct=index>=0&&q.choices[index].correct;game.streak=correct?game.streak+1:0;game.best=Math.max(game.best,game.streak);const points=correct?100+(game.streak>=3?20:0):0;game.points+=points;game.answers.push({q,selected:index,correct,points});if(!progress.seen.includes(q.id))progress.seen.push(q.id);progress.answered++;progress.correct+=correct?1:0;progress.points+=points;progress.bestStreak=Math.max(progress.bestStreak,game.streak);const stats=progress.topics[q.topic]||{correct:0,total:0};stats.total++;stats.correct+=correct?1:0;progress.topics[q.topic]=stats;if(correct){progress.mistakes=progress.mistakes.filter(id=>id!==q.id);if(!progress.mastered.includes(q.id))progress.mastered.push(q.id);}else{if(!progress.mistakes.includes(q.id))progress.mistakes.push(q.id);progress.mastered=progress.mastered.filter(id=>id!==q.id);}save();document.querySelectorAll('.answer').forEach((el,i)=>{el.disabled=true;if(q.choices[i].correct){el.classList.add('correct');el.insertAdjacentHTML('beforeend','<span class="answer-mark">✓ Doğru</span>');}else if(i===index){el.classList.add('incorrect');el.insertAdjacentHTML('beforeend','<span class="answer-mark">✕</span>');}});$('round-points').textContent=game.points;$('round-streak').textContent=game.streak;if(index===-1&&$('timer-value'))$('timer-value').textContent='0';$('feedback').innerHTML=`<div class="feedback ${correct?'':'wrong'}"><strong>${correct?`Doğru cevap! +${points} puan${game.streak>=3?' · Seri bonusu':''}`:index===-1?'Süre doldu. Bu soruyu birlikte pekiştirelim.':'Bu soru tekrar listene eklendi.'}</strong><p>${esc(q.explanation)}</p><a href="${questionSource(q)}" target="_blank" rel="noopener noreferrer">Konunun MEB kaynağını incele ↗</a></div>`;$('next-button').disabled=false;}
function next(){if(!game||!game.answered||game.finished)return;if(game.index+1===game.questions.length)finish();else{game.index++;renderQuestion();}}
function finish(){if(!game||game.finished)return;stopTimer();game.finished=true;progress.rounds++;save();const correct=game.answers.filter(a=>a.correct).length;const wrong=game.answers.filter(a=>!a.correct);const percent=Math.round(correct/game.questions.length*100);setView(`<div class="game-wrap"><section class="panel result animate-in"><header class="result-header"><div class="result-medal">${icon('cup')}</div><div class="eyebrow">TUR TAMAMLANDI</div><h1 tabindex="-1">${percent===100?'Kusursuz bir tur!':percent>=70?'Güzel ilerliyorsun!':'Bir tur, yeni bir adım.'}</h1><p>${wrong.length?`${correct} doğru yanıt verdin. ${wrong.length} soruyu tekrar ederek konuyu pekiştirebilirsin.`:'Tüm soruları doğru yanıtladın. Yeni bir konuyla rotana devam et.'}</p></header><div class="scoreboard"><div><strong style="color:var(--orange)">${game.points}</strong><small>Kazanılan puan</small></div><div><strong>${correct}/${game.questions.length}</strong><small>Doğru yanıt</small></div><div><strong>%${percent}</strong><small>Doğru oranı</small></div><div><strong>${game.best}</strong><small>En uzun seri</small></div></div><div class="result-actions">${wrong.length?`<button class="primary" data-action="retry-round">${icon('repeat')} Bu yanlışları çöz</button>`:`<button class="primary" data-action="again">${icon('repeat')} Yeni tur oyna</button>`}<button class="secondary" data-action="home">Konu seçimine dön</button></div><h2 class="review-title">Turun cevap anahtarı</h2>${game.answers.map((a,i)=>`<details class="review-item"><summary><span style="color:${a.correct?'#16825f':'#bc6645'}">${a.correct?'✓':'↻'}</span> ${i+1}. ${esc(a.q.text)}</summary><p>Yanıtın: ${a.selected<0?'Süre doldu':esc(a.q.choices[a.selected].text)}</p><p class="right"><strong>Doğru cevap:</strong> ${esc(a.q.options[0])}</p><p>${esc(a.q.explanation)}</p></details>`).join('')}</section></div>`,true);}
function showMistakes(){stopTimer();game=null;matching=null;page='mistakes';const items=QUESTIONS.filter(q=>progress.mistakes.includes(q.id));setView(`${introduction('Yanlışların, yeni fırsatların.','Tekrar et, nedenini öğren ve bu listeyi birlikte azaltalım.','PEKİŞTİRME ALANI',`${items.length} soru`)}${conceptMistakesPanel()}${items.length?`<section class="panel mistake-list"><div class="section-title"><h2 tabindex="-1">${items.length} soru seni bekliyor.</h2></div><p>Her turda en fazla 10 soru. Doğru yanıtladığın sorular listeden çıkar. Bu turda süre sınırı yok.</p><button class="primary" data-action="review">Yanlışları çöz ${icon('arrow')}</button>${items.map(q=>`<details class="review-item"><summary>${esc(q.text)}</summary><p class="right"><strong>Doğru cevap:</strong> ${esc(q.options[0])}</p><p>${esc(q.explanation)}</p></details>`).join('')}</section>`:`<section class="panel empty">${icon('check')}<h2 tabindex="-1">Tekrar listen boş.</h2><p>Yanlış yanıtladığın ve süresini kaçırdığın sorular burada birikecek. Bir tur oynayarak başlayabilirsin.</p><button class="primary" data-action="home">Oyun alanına dön ${icon('arrow')}</button></section>`}`,true);}
function showProgress(){stopTimer();game=null;matching=null;page='progress';setView(`${introduction('Adım adım gelişimin.','Bu tarayıcıdaki tüm turlarının toplamı.','SENİN ROTAN')}<section class="panel result"><div class="scoreboard"><div><strong>${progress.answered}</strong><small>Yanıtlanan soru</small></div><div><strong>${progress.correct}</strong><small>Doğru yanıt</small></div><div><strong>${progress.rounds}</strong><small>Tamamlanan tur</small></div><div><strong>${progress.points}</strong><small>Toplam puan</small></div></div><p class="start-meta">Aynı soru tekrar çözüldüğünde toplam yanıtlara yeniden eklenir. Bu göstergeler çalışma içindir; bir sınav puanı veya sıralama değildir.</p></section><section class="panel progress-list"><h2 style="font-size:18px">Konu konu durumun</h2>${TOPICS.map(t=>{const st=progress.topics[t.id]||{total:0,correct:0},pct=st.total?Math.round(st.correct/st.total*100):0;return `<div class="topic-progress"><span class="topic-symbol" style="color:${t.color};background:${t.color}15">${icon(t.icon)}</span><div class="info"><h3>${t.title}</h3><small>${st.total?`${st.correct} / ${st.total} doğru · %${pct}`:'Henüz soru çözülmedi'}</small><div class="track"><div class="track-fill" style="width:${pct}%;background:${t.color}"></div></div></div><button class="subtle-button" data-action="practice-topic" data-topic="${t.id}">Çalış ${icon('arrow')}</button></div>`;}).join('')}</section><p class="hint" style="margin-top:14px">${icon('shield')}Veriler yalnızca bu cihazın bu tarayıcısında saklanır. Başka cihazlara aktarılmaz; tarayıcı verileri temizlenirse silinir.</p>`,true);}
function openDialog(html){$('dialog-content').innerHTML=html;$('info-dialog').showModal();}
function navigate(action){if((game&&!game.finished)||(matching&&!matching.finished)){if(game){game.paused=true;game.remaining=['sprint','exam'].includes(game.mode)?Math.max(0,game.deadline-Date.now()):0;}stopTimer();pendingNav=action;openDialog('<h2 id="dialog-title">Turdan ayrılmak istiyor musun?</h2><p>Öğrenme turunda verdiğin yanıtlar korunur. Bitirilmemiş deneme kaydedilmez. Yarım kalan tur tamamlanan turlara eklenmez.</p><div class="actions"><button class="secondary" data-action="cancel-exit">Tura devam et</button><button class="primary" data-action="confirm-exit">Turdan ayrıl</button></div>');return;}runNavigation(action);}
function runNavigation(action){if(action==='home')goHome();else if(action==='mistakes')showMistakes();else if(action==='progress')showProgress();else if(action==='concepts')showConcepts();else if(action==='exam')showExamSetup();}
function resume(){pendingNav=null;if(game&&!game.finished){game.paused=false;if(['sprint','exam'].includes(game.mode)&&(!game.answered||game.mode==='exam')){if(game.deadline){game.deadline=Date.now()+game.remaining;timer=setInterval(game.mode==='exam'?examTick:tick,200);}}}}
// Additional study modes share the same local progress, with independent queues.
let matching=null, conceptCategory='all', conceptQuery='', conceptPage=0;
const normalize=s=>String(s).toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');
function availableTopics(){return TOPICS.filter(t=>selectedGrade==='all'||String(t.grade)===selectedGrade);}
function gradeFilters(){return `<div class="grade-filters" role="group" aria-label="Sınıf seçimi">${[['all','Tüm üniteler'],['9','9. sınıf'],['10','10. sınıf']].map(([id,label])=>`<button class="filter ${selectedGrade===id?'active':''}" data-action="grade" data-grade="${id}" aria-pressed="${selectedGrade===id}">${label}</button>`).join('')}</div>`;}
function featureCards(){return `<div class="feature-grid"><button class="feature-card" data-action="concepts"><span class="feature-icon purple">${icon('layers')}</span><strong>Kavram atölyesi</strong><p>${GLOSSARY.length} kavramı keşfet,<br>eşleştirerek pekiştir.</p><span>Atölyeyi aç ${icon('arrow')}</span></button><button class="feature-card" data-action="exam"><span class="feature-icon orange">${icon('target')}</span><strong>TYT DKAB denemesi</strong><p>5 soru · Paragraf ve yorum<br>Çözüm tur sonunda.</p><span>Kendini dene ${icon('arrow')}</span></button><button class="feature-card" data-action="mistakes"><span class="feature-icon green">${icon('repeat')}</span><strong>Yanlışlarım turu</strong><p>${progress.mistakes.length} soru, ${progress.conceptMistakes.length} kavram<br>yeniden çalışmanı bekliyor.</p><span>Eksiklerini tamamla ${icon('arrow')}</span></button></div>`;}
function conceptMistakesPanel(){if(!progress.conceptMistakes.length)return '';return `<section class="panel feature-panel"><div><h2>Eşleştirmede zorlandıkların</h2><p>${progress.conceptMistakes.length} kavram. Bir sonraki turda ilk denemede doğru eşleştirdiklerin listeden çıkar.</p></div><button class="primary" data-action="match-review">Kavramları tekrar et ${icon('arrow')}</button></section>`;}
function filteredConcepts(){return GLOSSARY.filter(c=>(conceptCategory==='all'||c.category===conceptCategory)&&normalize(`${c.term} ${(c.aliases||[]).join(' ')} ${c.definition} ${c.distinction||''}`).includes(normalize(conceptQuery)));}
function showConcepts(){stopTimer();game=null;matching=null;page='concepts';setView(`${introduction('Kavramları birbirine bağla.',`${GLOSSARY.length} kavram · Tanımlar, ayırt edici ipuçları ve eşleştirme turları.`, 'KAVRAM ATÖLYESİ','TYT / 9–12')}<section class="panel concept-controls"><div class="search-fields"><label>Ara<input id="concept-search" type="search" placeholder="Kavram veya tanım ara…" value="${esc(conceptQuery)}"></label><label>Konu<select id="concept-category"><option value="all">Tüm konular</option>${[...new Set(GLOSSARY.map(c=>c.category))].map(c=>`<option ${c===conceptCategory?'selected':''}>${esc(c)}</option>`).join('')}</select></label><button class="primary" data-action="match-start">${icon('layers')} Eşleştirmeye başla</button></div><p class="start-meta">Her turda 5 çift. Seçili konu ve arama sonuçları kullanılır. İlk kez göreceğin kavramlar önce gelir.</p></section><div id="concept-results" aria-live="polite"></div><p class="scope-note">Bu sözlük 9–12. sınıf DKAB içeriğinden TYT hazırlığına yönelik derlenmiştir; resmî ve kesin bir “2027’de çıkacak tüm kavramlar” listesi değildir. Soru turlarında 2027 adaylarının izlediği 2018 programının 9–10. sınıf üniteleri kullanılır.</p>`,true);renderConceptResults();}
function renderConceptResults(){const items=filteredConcepts(),pages=Math.max(1,Math.ceil(items.length/24));conceptPage=Math.min(conceptPage,pages-1);$('concept-results').innerHTML=`<div class="list-heading"><strong>${items.length} kavram</strong><span>Sayfa ${conceptPage+1} / ${pages}</span></div><div class="concept-grid">${items.slice(conceptPage*24,(conceptPage+1)*24).map(c=>`<article class="panel concept-card"><span class="category-label">${esc(c.category)}</span><h2>${esc(c.term)}</h2><p>${esc(c.definition)}</p>${c.scopeNote?`<p class="scope-note">${esc(c.scopeNote)}</p>`:''}${c.distinction?`<details><summary>Ayırt et</summary><p>${esc(c.distinction)}</p></details>`:''}</article>`).join('')||'<section class="panel empty"><h2>Sonuç bulunamadı.</h2><p>Farklı bir sözcük veya konu seçebilirsin.</p></section>'}</div><div class="pager"><button class="secondary" data-action="concept-prev" ${conceptPage===0?'disabled':''}>Önceki</button><button class="secondary" data-action="concept-next" ${conceptPage+1>=pages?'disabled':''}>Sonraki</button></div>`;}
document.addEventListener('input',event=>{if(event.target.id==='concept-search'){conceptQuery=event.target.value;conceptPage=0;renderConceptResults();}});
document.addEventListener('change',event=>{if(event.target.id==='concept-category'){conceptCategory=event.target.value;conceptPage=0;renderConceptResults();}});
function startMatching(review=false){const source=review?GLOSSARY.filter(c=>progress.conceptMistakes.includes(c.id)):filteredConcepts();if(!source.length){openDialog('<h2 id="dialog-title">Eşleşecek kavram bulunamadı.</h2><p>Arama veya konu filtresini değiştir.</p><button class="primary" data-action="close-dialog">Tamam</button>');return;}stopTimer();game=null;page='concepts';const ordered=[...shuffle(source.filter(c=>!progress.conceptMastered.includes(c.id))),...shuffle(source.filter(c=>progress.conceptMastered.includes(c.id)))];const groups=new Set(),pool=[];for(const c of ordered){if(c.synonymGroup&&groups.has(c.synonymGroup))continue;pool.push(c);if(c.synonymGroup)groups.add(c.synonymGroup);if(pool.length===5)break;}matching={items:pool,left:shuffle(pool),right:shuffle(pool),selectedLeft:null,selectedRight:null,solved:[],failed:[],errors:0,feedback:'Bir kavram ve ona ait tanımı seç.',finished:false,review};renderMatching(true);}
function renderMatching(focus=false){const m=matching;if(!m)return;setView(`${introduction('Bir kavram, bir anlam.',`${m.solved.length} / ${m.items.length} eşleşme · ${m.errors} hatalı deneme`,'EŞLEŞTİRME TURU',m.review?'YANLIŞ KAVRAMLAR':'KAVRAM ATÖLYESİ')}<section class="panel match-panel"><div class="match-columns"><div><h2>Kavramlar</h2>${m.left.map(c=>`<button class="match-tile ${m.solved.includes(c.id)?'matched':''} ${m.selectedLeft===c.id?'selected':''}" data-action="match-left" data-id="${c.id}" aria-pressed="${m.selectedLeft===c.id}" ${m.solved.includes(c.id)?'disabled':''}>${esc(c.term)}${m.solved.includes(c.id)?' ✓':''}</button>`).join('')}</div><div><h2>Tanımlar</h2>${m.right.map(c=>`<button class="match-tile definition ${m.solved.includes(c.id)?'matched':''} ${m.selectedRight===c.id?'selected':''}" data-action="match-right" data-id="${c.id}" aria-pressed="${m.selectedRight===c.id}" ${m.solved.includes(c.id)?'disabled':''}>${esc(c.definition)}</button>`).join('')}</div></div><p class="match-feedback" role="status">${esc(m.feedback)}</p>${m.finished?`<div class="match-complete"><h2>Hepsini eşleştirdin!</h2><p>${m.items.length} kavram · ${m.errors} hatalı deneme. ${m.failed.length?'Zorlandığın kavramlar yanlışlarım listesinde kaldı; yeni bir turda ilk seferde doğru eşleştirerek çıkarabilirsin.':'Bu turdaki kavramları ilk denemede eşleştirdin.'}</p><div class="result-actions"><button class="primary" data-action="${m.review&&progress.conceptMistakes.length?'match-review':'match-start'}">Yeni eşleştirme turu</button><button class="secondary" data-action="concepts">Sözlüğe dön</button></div></div>`:'<p class="start-meta">Klavye ile Tab ve Enter tuşlarını kullanabilirsin. Yanlış eşleştirmede iki kavram da tekrar listene eklenir.</p>'}</section>`,focus);}
function selectMatch(side,id){const m=matching;if(!m||m.finished||!m.items.some(c=>c.id===id)||m.solved.includes(id))return;m[side==='left'?'selectedLeft':'selectedRight']=id;if(m.selectedLeft&&m.selectedRight){const left=m.selectedLeft,right=m.selectedRight;if(left===right){m.solved.push(left);const c=m.items.find(x=>x.id===left);if(!m.failed.includes(left)){progress.conceptMistakes=progress.conceptMistakes.filter(x=>x!==left);if(!progress.conceptMastered.includes(left))progress.conceptMastered.push(left);}m.feedback=`Doğru: ${c.term}. ${c.distinction||c.definition}`;}else{m.errors++;for(const key of [left,right]){if(!m.failed.includes(key))m.failed.push(key);if(!progress.conceptMistakes.includes(key))progress.conceptMistakes.push(key);progress.conceptMastered=progress.conceptMastered.filter(x=>x!==key);}m.feedback='Bu iki kart eşleşmiyor. Tanımın ayırt edici özelliğine bakarak yeniden dene.';}m.selectedLeft=null;m.selectedRight=null;if(m.solved.length===m.items.length){m.finished=true;progress.matchRounds++;}save();}renderMatching();}
function showExamSetup(){stopTimer();game=null;matching=null;page='exam';const last=progress.examHistory.at(-1);setView(`${introduction('Bilgini yorumla, kendini dene.','Paragraf, kavram ayrımı ve çıkarım sorularıyla TYT DKAB pratiği.','TYT DKAB DENEMESİ','5 SORU')}<div class="workspace"><section class="panel exam-setup"><span class="category-label">ÖZGÜN SORULAR · 2026–2027 HAZIRLIK</span><h2>TYT’nin DKAB bölümüne odaklan.</h2><p>Her denemede bilgi–inanç, ibadet, ahlak, Hz. Muhammed ve dinî yorumlar alanlarından birer soru gelir. Bu dağılım çalışma amacıyla seçilmiştir; ÖSYM’nin her yıl sabit konu dağılımı değildir.</p><div class="exam-facts"><span><strong>5</strong> soru</span><span><strong>${EXAMS.length}</strong> soruluk havuz</span><span><strong>D − Y/4</strong> net</span></div><label class="timer-label">Çalışma süresi<select id="exam-duration"><option value="480">8 dakika</option><option value="600">10 dakika</option><option value="0">Süresiz</option></select></label><p class="start-meta">Bu süre bir çalışma tercihidir; TYT’de DKAB için ayrı bir resmî süre yoktur. Cevaplarını değiştirebilir, soru atlayabilirsin. Çözümler bitirince açılır.</p><button class="primary" data-action="exam-start">Denemeyi başlat ${icon('arrow')}</button></section><aside class="panel exam-last"><h2>Son denemen</h2>${last?`<strong>${formatNet(last.correct-last.wrong/4)} net</strong><p>${last.correct} doğru · ${last.wrong} yanlış · ${last.blank} boş</p><small>${new Date(last.date).toLocaleDateString('tr-TR')}</small>`:'<p>Henüz tamamlanmış bir denemen yok. İlk denemen burada görünecek.</p>'}<p class="scope-note">ÖSYM’nin yayımladığı soruların biçimi incelenerek özgün hazırlanmıştır. Çıkmış soru veya ÖSYM onaylı bir deneme değildir.</p></aside></div>`,true);}
function formatNet(n){return n.toLocaleString('tr-TR',{maximumFractionDigits:2});}
function startExam(){const seconds=Number($('exam-duration')?.value??480);const pool=shuffle(['bilgi','ibadet','ahlak','peygamber','yorum'].map(domain=>{const items=EXAMS.filter(q=>q.examDomain===domain);return [...shuffle(items.filter(q=>!progress.examSeen.includes(q.id))),...shuffle(items.filter(q=>progress.examSeen.includes(q.id)))][0];}));stopTimer();matching=null;game={mode:'exam',questions:pool.map(q=>({...q,choices:shuffle(q.options.map((text,i)=>({text,correct:i===0})))})),selections:Array(5).fill(-1),index:0,deadline:seconds?Date.now()+seconds*1000:0,remaining:seconds*1000,paused:false,finished:false};page='exam';renderExamQuestion(true);if(seconds)timer=setInterval(examTick,200);}
function examClock(){if(!game.deadline)return 'Süresiz';const s=Math.max(0,Math.ceil((game.deadline-Date.now())/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function renderExamQuestion(focus=false){const q=game.questions[game.index],chosen=game.selections[game.index];setView(`<div class="game-wrap"><div class="game-status"><button class="subtle-button" data-action="home">${icon('back')} Denemeden çık</button><span class="pill" id="exam-clock" role="timer" aria-label="Kalan çalışma süresi">${icon('clock')} ${examClock()}</span></div><section class="panel question-card"><div class="q-top"><span class="topic-tag">TYT DKAB · Özgün deneme</span><span>Çözümler tur sonunda</span></div><div class="exam-numbers" role="group" aria-label="Deneme soruları">${game.questions.map((_,i)=>`<button data-action="exam-jump" data-index="${i}" class="${i===game.index?'current':''} ${game.selections[i]>=0?'filled':''}" aria-label="${i+1}. soru${game.selections[i]>=0?', işaretli':''}" ${i===game.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><div class="question-number">SORU ${game.index+1} / 5</div><h1 tabindex="-1">${esc(q.text)}</h1><div class="answers" role="group" aria-label="Cevap seçenekleri">${q.choices.map((c,i)=>`<button class="answer ${chosen===i?'exam-selected':''}" data-action="exam-answer" data-index="${i}" aria-pressed="${chosen===i}"><span class="answer-letter">${'ABCDE'[i]}</span><span>${esc(c.text)}</span></button>`).join('')}</div><div class="exam-actions"><button class="subtle-button" data-action="exam-clear" ${chosen<0?'disabled':''}>İşareti kaldır</button><span>${game.selections.filter(i=>i>=0).length} / 5 işaretli</span></div><div class="result-actions"><button class="secondary" data-action="exam-prev" ${game.index===0?'disabled':''}>Önceki</button>${game.index<4?'<button class="primary" data-action="exam-next">Sonraki / boş bırak →</button>':'<button class="primary" data-action="exam-submit">Denemeyi bitir</button>'}</div></section></div>`,focus);}
function chooseExam(i){if(game?.mode!=='exam'||game.finished||game.paused)return;if(game.deadline&&Date.now()>=game.deadline){finishExam(true);return;}if(Number.isInteger(i)&&i>=0&&i<5){game.selections[game.index]=i;renderExamQuestion();}}
function examTick(){if(game?.mode!=='exam'||game.finished||game.paused||!game.deadline)return;if(Date.now()>=game.deadline){if($('info-dialog').open){pendingNav=null;$('info-dialog').close();}finishExam(true);}else if($('exam-clock'))$('exam-clock').innerHTML=icon('clock')+' '+examClock();}
function requestExamFinish(){const blanks=game.selections.filter(i=>i<0).length;openDialog(`<h2 id="dialog-title">Denemeyi bitir?</h2><p>${blanks?`${blanks} soruyu boş bıraktın. `:''}Bitirdiğinde cevap anahtarı ve açıklamalar açılacak.</p><div class="actions"><button class="secondary" data-action="close-dialog">Devam et</button><button class="primary" data-action="exam-finish">Bitir ve çözümleri gör</button></div>`);}
function recordExamAnswer(q,correct){if(!progress.seen.includes(q.id))progress.seen.push(q.id);if(!progress.examSeen.includes(q.id))progress.examSeen.push(q.id);progress.answered++;if(correct){progress.correct++;progress.points+=100;progress.mistakes=progress.mistakes.filter(id=>id!==q.id);if(!progress.mastered.includes(q.id))progress.mastered.push(q.id);}else{if(!progress.mistakes.includes(q.id))progress.mistakes.push(q.id);progress.mastered=progress.mastered.filter(id=>id!==q.id);}}
function finishExam(expired=false){if(game?.mode!=='exam'||game.finished)return;stopTimer();game.finished=true;const answers=game.questions.map((q,i)=>{const selected=game.selections[i],correct=selected>=0&&q.choices[selected].correct;recordExamAnswer(q,correct);return {q,selected,correct};});game.answers=answers;const correct=answers.filter(a=>a.correct).length,blank=answers.filter(a=>a.selected<0).length,wrong=5-correct-blank;progress.examHistory.push({date:Date.now(),correct,wrong,blank});progress.examHistory=progress.examHistory.slice(-20);progress.rounds++;save();setView(`<div class="game-wrap"><section class="panel result"><header class="result-header"><div class="eyebrow">${expired?'ÇALIŞMA SÜRESİ DOLDU':'DENEME TAMAMLANDI'}</div><h1 tabindex="-1">${formatNet(correct-wrong/4)} / 5 net</h1><p>Doğru − yanlış / 4 · Boşlar netini düşürmez.</p></header><div class="scoreboard"><div><strong>${correct}</strong><small>Doğru</small></div><div><strong>${wrong}</strong><small>Yanlış</small></div><div><strong>${blank}</strong><small>Boş</small></div><div><strong>${correct*100}</strong><small>Çalışma puanı</small></div></div><div class="result-actions"><button class="primary" data-action="exam">Yeni deneme</button>${correct<5?'<button class="secondary" data-action="retry-round">Yanlış ve boşları çalış</button>':''}</div><h2 class="review-title">Cevaplar ve çözüm gerekçeleri</h2>${answers.map((a,i)=>`<details class="review-item"><summary>${a.correct?'✓':a.selected<0?'○':'↻'} ${i+1}. ${esc(a.q.text)}</summary><p>Yanıtın: ${a.selected<0?'Boş':esc(a.q.choices[a.selected].text)}</p><p class="right"><strong>Doğru cevap:</strong> ${esc(a.q.options[0])}</p><p>${esc(a.q.explanation)}</p></details>`).join('')}</section></div>`,true);}
function sources(){openDialog(`<h2 id="dialog-title">Kapsam ve kaynaklar</h2><p>${PRACTICE.length} ünite sorusu, ${EXAMS.length} özgün deneme sorusu ve ${GLOSSARY.length} kavram. Soruların tamamı özgün alıştırmadır; çıkmış ÖSYM soruları kullanılmamıştır.</p><p>9–10. sınıf soru bankası, 2027 TYT adaylarının lise eğitiminde izlediği 2018 DKAB programının ünite düzenini kullanır. 2026–2027’de alt sınıflarda uygulanan Maarif programı ile aynı ünite sıralaması değildir. MEB, yeni programla yetişen ilk grubun 2028’de YKS’ye gireceğini açıklamıştır.</p><p>31 Ekim 2026 araştırmasında ayrı bir resmî 2027 kapsam belgesi doğrulanamadı. Hazırlık için son erişilen 2026 YKS kazanım duyurusu ve MEB materyalleri esas alındı. Kavram sözlüğü 9–12. sınıf destek kavramlarını da içerir; kesin bir sınav listesi veya çıkma garantisi değildir.</p><ul><li><a target="_blank" rel="noopener noreferrer" href="https://ttkb.meb.gov.tr/www/icerik_goruntule.php?DIL=tr&KNO=831">MEB · 2026 YKS konu ve kazanım duyurusu</a></li><li><a target="_blank" rel="noopener noreferrer" href="https://www.meb.gov.tr/yks-ve-lgsde-yeni-mufredata-uyumlu-soru-modeli-2028de-hayata-gececek/haber/39265/tr">MEB · 2028 geçiş açıklaması</a></li><li><a target="_blank" rel="noopener noreferrer" href="https://ogmmateryal.eba.gov.tr/yks-konu-anlatim?d=0&k=0&kod=DIN&s=0&u=0">OGM Materyal · DKAB konu anlatımları</a></li><li><a target="_blank" rel="noopener noreferrer" href="https://www.osym.gov.tr/2025yks-tyt-ayt-ve-ydt-temel-soru-kitapciklari-ve-cevap-anahtarlari">ÖSYM · 2025 TYT kitapçığı</a></li><li><a target="_blank" rel="noopener noreferrer" href="https://cdn.osym.gov.tr/pdfdokuman/2026/YKS/TSK/yks_tyt_2026_kitapcik_d350.pdf">ÖSYM · 2026 TYT kitapçığı</a></li></ul><p>5 soruluk denemelerde konu dağılımı ve 8/10 dakikalık süre çalışma tercihidir. Net: doğru − yanlış / 4. Boşlar tekrar listesine alınır; netten düşülmez.</p><p>Gelişimin yalnızca bu tarayıcıda saklanır. Önceki toplam puanın korunur. Yarım bırakılan deneme puanlanmaz; sayfa yenilenirse aktif tur kapanır.</p><button class="primary" data-action="close-dialog">Tamam</button>`);}
function handleNewAction(action,b){if(action==='grade'){selectedGrade=b.dataset.grade;selectedTopic='all';renderHome();}else if(action==='concept-prev'||action==='concept-next'){conceptPage+=action==='concept-next'?1:-1;renderConceptResults();}else if(action==='match-start')startMatching();else if(action==='match-review')startMatching(true);else if(action==='match-left'||action==='match-right')selectMatch(action==='match-left'?'left':'right',b.dataset.id);else if(action==='exam-start')startExam();else if(action==='exam-answer')chooseExam(Number(b.dataset.index));else if(action==='exam-clear'){game.selections[game.index]=-1;renderExamQuestion();}else if(['exam-next','exam-prev','exam-jump'].includes(action)){if(!game||game.finished)return true;const index=action==='exam-jump'?Number(b.dataset.index):game.index+(action==='exam-next'?1:-1);if(index>=0&&index<5){game.index=index;renderExamQuestion(true);}}else if(action==='exam-submit')requestExamFinish();else if(action==='exam-finish'){$('info-dialog').close();finishExam();}else return false;return true;}

document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(['home','mistakes','progress','concepts','exam'].includes(action)){navigate(action);return;}if(handleNewAction(action,b))return;if(action==='topic'){selectedTopic=b.dataset.topic;renderHome();}else if(action==='mode'){selectedMode=b.dataset.mode;renderHome();}else if(action==='start')startGame();else if(action==='answer')answer(Number(b.dataset.index));else if(action==='next')next();else if(action==='again')startGame(game.mode,game.topic);else if(action==='retry-round'){const ids=game.answers.filter(a=>!a.correct).map(a=>a.q.id);startGame('review','all',ids);}else if(action==='review')startGame('review','all',progress.mistakes);else if(action==='practice-topic')startGame('learn',b.dataset.topic);else if(action==='sources')sources();else if(action==='close-dialog')$('info-dialog').close();else if(action==='cancel-exit'){$('info-dialog').close();resume();}else if(action==='confirm-exit'){const target=pendingNav;pendingNav=null;$('info-dialog').close();runNavigation(target);}});
$('info-dialog').addEventListener('cancel',()=>{if(pendingNav)resume();});
document.addEventListener('keydown',event=>{if(!game||game.finished||game.paused||$('info-dialog').open||event.ctrlKey||event.metaKey||event.altKey||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||event.repeat)return;if(game.mode==='exam'){if(/^[1-5]$/.test(event.key)){event.preventDefault();chooseExam(Number(event.key)-1);}return;}if(event.key==='Enter'&&game.answered){event.preventDefault();next();return;}const key=event.key.toUpperCase();const index=/^[1-5]$/.test(key)?Number(key)-1:'ABCDE'.indexOf(key);if(key.length===1&&index>=0&&!game.answered){event.preventDefault();answer(index);}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(game?.mode==='exam')examTick();else tick();}});
window.addEventListener('pagehide',stopTimer);
window.addEventListener('pageshow',event=>{if(event.persisted&&game&&!game.answered&&!game.paused&&['sprint','exam'].includes(game.mode)){if(game.mode==='exam'){examTick();if(!game.finished)timer=setInterval(examTick,200);}else{tick();if(!game.answered)timer=setInterval(tick,200);}}});
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
renderHome();
// Optional browser-native agent support. Unsupported browsers keep the same UI.
const modelContext=document.modelContext;
if(modelContext?.registerTool){try{Promise.resolve(modelContext.registerTool({name:'start_dkab_practice',title:'DKAB öğrenme turu başlat',description:'Seçilen konuda yeni, süresiz bir öğrenme turu başlatır. Devam eden tur varsa değiştirmez.',inputSchema:{type:'object',properties:{topic:{type:'string',enum:['all',...TOPICS.map(t=>t.id)]}},required:['topic'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length!==1||!['all',...TOPICS.map(t=>t.id)].includes(input.topic))throw new Error('Geçersiz konu.');if((game&&!game.finished)||(matching&&!matching.finished))throw new Error('Önce mevcut turu tamamlayın.');if($('info-dialog').open)throw new Error('Önce açık pencereyi kapatın.');startGame('learn',input.topic);return {started:true,topic:input.topic,questionCount:game.questions.length};}})).catch(()=>{});}catch{/* Browser support is optional. */}}
</script></body></html>
