function currentQuestion(){return game?.questions[game.index];}
function questionSource(q){return topicBy(q.topic).source;}
function renderQuestion(){if(!game)return;stopTimer();game.answered=false;game.remaining=30;game.deadline=Date.now()+30000;const q=currentQuestion(),t=topicBy(q.topic);setView(`<div class="game-wrap animate-in"><div class="game-status"><button class="subtle-button" data-action="home">${icon('back')} Turdan çık</button><div class="game-chips"><span class="pill orange">${icon('spark')} <span id="round-points">${game.points}</span> puan</span><span class="pill" id="streak-chip">${icon('target')} <span id="round-streak">${game.streak}</span> seri</span>${game.mode==='sprint'?`<span class="pill" id="timer-chip">${icon('clock')} <span id="timer-value">30</span> sn</span>`:'<span class="pill">Süresiz</span>'}</div></div><section class="panel question-card"><div class="q-top"><span class="topic-tag">${t.title}</span><span>${game.mode==='review'?'Yanlışları pekiştir':game.mode==='sprint'?'Hızlı tur':'Öğrenme turu'}</span></div><div class="track" role="progressbar" aria-label="Tur ilerlemesi" aria-valuemin="0" aria-valuemax="${game.questions.length}" aria-valuenow="${game.index}"><div class="track-fill" style="width:${game.index/game.questions.length*100}%"></div></div><div class="question-kind">${q.kind}</div><div class="question-number">SORU ${String(game.index+1).padStart(2,'0')} <span style="color:#b8bdc8">/ ${String(game.questions.length).padStart(2,'0')}</span></div><h1 tabindex="-1">${q.text}</h1><div class="answers" role="group" aria-label="Cevap seçenekleri">${q.choices.map((choice,i)=>`<button class="answer" data-action="answer" data-index="${i}"><span class="answer-letter">${'ABCDE'[i]}</span><span>${esc(choice.text)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="question-footer"><p class="keyboard"><kbd>1</kbd>–<kbd>5</kbd> veya <kbd>A</kbd>–<kbd>E</kbd> ile yanıtla.<br>Açıklamadan sonra <kbd>Enter</kbd> ile ilerle.</p><button class="primary" id="next-button" data-action="next" disabled>${game.index+1===game.questions.length?'Sonucu gör':'Sonraki soru'} ${icon('arrow')}</button></div></section></div>`,true);if(game.mode==='sprint')timer=setInterval(tick,200);}
function tick(){if(!game||game.mode!=='sprint'||game.answered||game.paused)return;const remaining=Math.max(0,Math.ceil((game.deadline-Date.now())/1000));game.remaining=remaining;if($('timer-value'))$('timer-value').textContent=remaining;$('timer-chip')?.classList.toggle('timer-low',remaining<=8);if(remaining===0)answer(-1);}
function answer(index){if(!game||game.answered||game.finished||game.paused)return;if(!Number.isInteger(index)||index< -1||index>4)return;if(game.mode==='sprint'&&Date.now()>=game.deadline)index=-1;stopTimer();game.answered=true;const q=currentQuestion();const correct=index>=0&&q.choices[index].correct;game.streak=correct?game.streak+1:0;game.best=Math.max(game.best,game.streak);const points=correct?100+(game.streak>=3?20:0):0;game.points+=points;game.answers.push({q,selected:index,correct,points});if(!progress.seen.includes(q.id))progress.seen.push(q.id);progress.answered++;progress.correct+=correct?1:0;progress.points+=points;progress.bestStreak=Math.max(progress.bestStreak,game.streak);const stats=progress.topics[q.topic]||{correct:0,total:0};stats.total++;stats.correct+=correct?1:0;progress.topics[q.topic]=stats;if(correct){progress.mistakes=progress.mistakes.filter(id=>id!==q.id);if(!progress.mastered.includes(q.id))progress.mastered.push(q.id);}else{if(!progress.mistakes.includes(q.id))progress.mistakes.push(q.id);progress.mastered=progress.mastered.filter(id=>id!==q.id);}save();document.querySelectorAll('.answer').forEach((el,i)=>{el.disabled=true;if(q.choices[i].correct){el.classList.add('correct');el.insertAdjacentHTML('beforeend','<span class="answer-mark">✓ Doğru</span>');}else if(i===index){el.classList.add('incorrect');el.insertAdjacentHTML('beforeend','<span class="answer-mark">✕</span>');}});$('round-points').textContent=game.points;$('round-streak').textContent=game.streak;if(index===-1&&$('timer-value'))$('timer-value').textContent='0';$('feedback').innerHTML=`<div class="feedback ${correct?'':'wrong'}"><strong>${correct?`Doğru cevap! +${points} puan${game.streak>=3?' · Seri bonusu':''}`:index===-1?'Süre doldu. Bu soruyu birlikte pekiştirelim.':'Bu soru tekrar listene eklendi.'}</strong><p>${esc(q.explanation)}</p><a href="${questionSource(q)}" target="_blank" rel="noopener noreferrer">Konunun MEB kaynağını incele ↗</a></div>`;$('next-button').disabled=false;}
function next(){if(!game||!game.answered||game.finished)return;if(game.index+1===game.questions.length)finish();else{game.index++;renderQuestion();}}
function finish(){if(!game||game.finished)return;stopTimer();game.finished=true;progress.rounds++;save();const correct=game.answers.filter(a=>a.correct).length;const wrong=game.answers.filter(a=>!a.correct);const percent=Math.round(correct/game.questions.length*100);setView(`<div class="game-wrap"><section class="panel result animate-in"><header class="result-header"><div class="result-medal">${icon('cup')}</div><div class="eyebrow">TUR TAMAMLANDI</div><h1 tabindex="-1">${percent===100?'Kusursuz bir tur!':percent>=70?'Güzel ilerliyorsun!':'Bir tur, yeni bir adım.'}</h1><p>${wrong.length?`${correct} doğru yanıt verdin. ${wrong.length} soruyu tekrar ederek konuyu pekiştirebilirsin.`:'Tüm soruları doğru yanıtladın. Yeni bir konuyla rotana devam et.'}</p></header><div class="scoreboard"><div><strong style="color:var(--orange)">${game.points}</strong><small>Kazanılan puan</small></div><div><strong>${correct}/${game.questions.length}</strong><small>Doğru yanıt</small></div><div><strong>%${percent}</strong><small>Doğru oranı</small></div><div><strong>${game.best}</strong><small>En uzun seri</small></div></div><div class="result-actions">${wrong.length?`<button class="primary" data-action="retry-round">${icon('repeat')} Bu yanlışları çöz</button>`:`<button class="primary" data-action="again">${icon('repeat')} Yeni tur oyna</button>`}<button class="secondary" data-action="home">Konu seçimine dön</button></div><h2 class="review-title">Turun cevap anahtarı</h2>${game.answers.map((a,i)=>`<details class="review-item"><summary><span style="color:${a.correct?'#16825f':'#bc6645'}">${a.correct?'✓':'↻'}</span> ${i+1}. ${esc(a.q.text)}</summary><p>Yanıtın: ${a.selected<0?'Süre doldu':esc(a.q.choices[a.selected].text)}</p><p class="right"><strong>Doğru cevap:</strong> ${esc(a.q.options[0])}</p><p>${esc(a.q.explanation)}</p></details>`).join('')}</section></div>`,true);}
function showMistakes(){stopTimer();game=null;page='mistakes';const items=QUESTIONS.filter(q=>progress.mistakes.includes(q.id));setView(`${introduction('Yanlışların, yeni fırsatların.','Tekrar et, nedenini öğren ve bu listeyi birlikte azaltalım.','PEKİŞTİRME ALANI',`${items.length} soru`)}${items.length?`<section class="panel mistake-list"><div class="section-title"><h2 tabindex="-1">${items.length} soru seni bekliyor.</h2></div><p>Her turda en fazla 10 soru. Doğru yanıtladığın sorular listeden çıkar. Bu turda süre sınırı yok.</p><button class="primary" data-action="review">Yanlışları çöz ${icon('arrow')}</button>${items.map(q=>`<details class="review-item"><summary>${esc(q.text)}</summary><p class="right"><strong>Doğru cevap:</strong> ${esc(q.options[0])}</p><p>${esc(q.explanation)}</p></details>`).join('')}</section>`:`<section class="panel empty">${icon('check')}<h2 tabindex="-1">Tekrar listen boş.</h2><p>Yanlış yanıtladığın ve süresini kaçırdığın sorular burada birikecek. Bir tur oynayarak başlayabilirsin.</p><button class="primary" data-action="home">Oyun alanına dön ${icon('arrow')}</button></section>`}`,true);}
function showProgress(){stopTimer();game=null;page='progress';setView(`${introduction('Adım adım gelişimin.','Bu tarayıcıdaki tüm turlarının toplamı.','SENİN ROTAN')}<section class="panel result"><div class="scoreboard"><div><strong>${progress.answered}</strong><small>Yanıtlanan soru</small></div><div><strong>${progress.correct}</strong><small>Doğru yanıt</small></div><div><strong>${progress.rounds}</strong><small>Tamamlanan tur</small></div><div><strong>${progress.points}</strong><small>Toplam puan</small></div></div><p class="start-meta">Aynı soru tekrar çözüldüğünde toplam yanıtlara yeniden eklenir. Bu göstergeler çalışma içindir; bir sınav puanı veya sıralama değildir.</p></section><section class="panel progress-list"><h2 style="font-size:18px">Konu konu durumun</h2>${TOPICS.map(t=>{const st=progress.topics[t.id]||{total:0,correct:0},pct=st.total?Math.round(st.correct/st.total*100):0;return `<div class="topic-progress"><span class="topic-symbol" style="color:${t.color};background:${t.color}15">${icon(t.icon)}</span><div class="info"><h3>${t.title}</h3><small>${st.total?`${st.correct} / ${st.total} doğru · %${pct}`:'Henüz soru çözülmedi'}</small><div class="track"><div class="track-fill" style="width:${pct}%;background:${t.color}"></div></div></div><button class="subtle-button" data-action="practice-topic" data-topic="${t.id}">Çalış ${icon('arrow')}</button></div>`;}).join('')}</section><p class="hint" style="margin-top:14px">${icon('shield')}Veriler yalnızca bu cihazın bu tarayıcısında saklanır. Başka cihazlara aktarılmaz; tarayıcı verileri temizlenirse silinir.</p>`,true);}
function openDialog(html){$('dialog-content').innerHTML=html;$('info-dialog').showModal();}
function sources(){openDialog(`<h2 id="dialog-title">Kaynaklar & oyun bilgisi</h2><p>Abdullah Çam’la TYT’ye Doğru, 9. sınıfın 5 ünitesinde toplam 200 özgün ve açıklamalı soru içerir. Her ünitede 40 soru vardır. 150 soru doğrudan kavram tanımı veya kısa örnekten kavrama ulaşma üzerinedir.</p><p>TYT’ye hazırlanan mevcut 12. sınıf öğrencilerinin 9. sınıfta izlediği 2018 DKAB programı esas alınmıştır. Yeni 9. sınıfların Maarif Modeli ünite sıralaması farklıdır.</p><p>Turlar 10 soruluktur. Önce çözülmemiş sorular gelir; bir üniteyi art arda dört tam tur çalışarak 40 soruyu görebilirsin. Sorular çıkmış ÖSYM soruları değildir.</p><ul><li><a href="https://ogmmateryal.eba.gov.tr/yks-konu-anlatim?d=0&k=0&kod=DIN&s=0&u=0" target="_blank" rel="noopener noreferrer">OGM Materyal · YKS konu anlatımları</a></li>${TOPICS.map(t=>`<li><a href="${t.source}" target="_blank" rel="noopener noreferrer">${t.title} · MEB kaynağı</a></li>`).join('')}</ul><p>Her doğru 100 puan; aynı turda 3. ve sonraki ardışık doğrular +20 puan kazandırır. Yanlışlar puan düşürmez. Hızlı turda her soru 30 saniyedir; sekme değiştirildiğinde süre devam eder.</p><p>Hesap, isim veya iletişim bilgisi istenmez. Oyun gelişimi sadece bu tarayıcıda tutulur. Sayfa yenilenirse mevcut tur kapanır; verilmiş yanıtların kaydı korunur.</p><div class="actions"><button class="primary" data-action="close-dialog">Tamam</button></div>`);}
function navigate(action){if(game&&!game.finished){game.paused=true;game.remaining=game.mode==='sprint'?Math.max(0,game.deadline-Date.now()):0;stopTimer();pendingNav=action;openDialog('<h2 id="dialog-title">Turdan ayrılmak istiyor musun?</h2><p>Şimdiye kadar verdiğin yanıtlar ve kazandığın puanlar korunur. Yarım kalan tur, tamamlanan turlara eklenmez.</p><div class="actions"><button class="secondary" data-action="cancel-exit">Tura devam et</button><button class="primary" data-action="confirm-exit">Turdan ayrıl</button></div>');return;}runNavigation(action);}
function runNavigation(action){if(action==='home')goHome();else if(action==='mistakes')showMistakes();else if(action==='progress')showProgress();}
function resume(){pendingNav=null;if(game&&!game.finished){game.paused=false;if(game.mode==='sprint'&&!game.answered){game.deadline=Date.now()+game.remaining;timer=setInterval(tick,200);}}}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(['home','mistakes','progress'].includes(action)){navigate(action);return;}if(action==='topic'){selectedTopic=b.dataset.topic;renderHome();}else if(action==='mode'){selectedMode=b.dataset.mode;renderHome();}else if(action==='start')startGame();else if(action==='answer')answer(Number(b.dataset.index));else if(action==='next')next();else if(action==='again')startGame(game.mode,game.topic);else if(action==='retry-round'){const ids=game.answers.filter(a=>!a.correct).map(a=>a.q.id);startGame('review','all',ids);}else if(action==='review')startGame('review','all',progress.mistakes);else if(action==='practice-topic')startGame('learn',b.dataset.topic);else if(action==='sources')sources();else if(action==='close-dialog')$('info-dialog').close();else if(action==='cancel-exit'){$('info-dialog').close();resume();}else if(action==='confirm-exit'){const target=pendingNav;pendingNav=null;$('info-dialog').close();runNavigation(target);}});
$('info-dialog').addEventListener('cancel',()=>{if(pendingNav)resume();});
document.addEventListener('keydown',event=>{if(!game||game.finished||game.paused||$('info-dialog').open||event.ctrlKey||event.metaKey||event.altKey||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||event.repeat)return;if(event.key==='Enter'&&game.answered){event.preventDefault();next();return;}const key=event.key.toUpperCase();const index=/^[1-5]$/.test(key)?Number(key)-1:'ABCDE'.indexOf(key);if(key.length===1&&index>=0&&!game.answered){event.preventDefault();answer(index);}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
window.addEventListener('pagehide',stopTimer);
window.addEventListener('pageshow',event=>{if(event.persisted&&game&&!game.answered&&!game.paused&&game.mode==='sprint'){tick();if(!game.answered)timer=setInterval(tick,200);}});
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
renderHome();
// Optional browser-native agent support. Unsupported browsers keep the same UI.
const modelContext=document.modelContext;
if(modelContext?.registerTool){try{Promise.resolve(modelContext.registerTool({name:'start_dkab_practice',title:'DKAB öğrenme turu başlat',description:'Seçilen konuda yeni, süresiz bir öğrenme turu başlatır. Devam eden tur varsa değiştirmez.',inputSchema:{type:'object',properties:{topic:{type:'string',enum:['all',...TOPICS.map(t=>t.id)]}},required:['topic'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length!==1||!['all',...TOPICS.map(t=>t.id)].includes(input.topic))throw new Error('Geçersiz konu.');if(game&&!game.finished)throw new Error('Önce mevcut turu tamamlayın.');if($('info-dialog').open)throw new Error('Önce açık pencereyi kapatın.');startGame('learn',input.topic);return {started:true,topic:input.topic,questionCount:game.questions.length};}})).catch(()=>{});}catch{/* Browser support is optional. */}}
</script></body></html>
