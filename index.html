['bilgi','Ön yargılardan uzak biçimde düşünebilen, doğruyu yanlıştan ayırmada kullanılan akıl için hangi kavram kullanılır?',['Selim akıl','Salim duyular','Mütevatir haber','Taklidî iman','İlham'],'Selim akıl, sağlıklı değerlendirme yapabilen akıldır. Salim duyular ise sağlıklı işleyen duyu organlarıyla ilgilidir.'],

['bilgi','İmanın özüyle ilgili aşağıdaki açıklamalardan hangisi doğrudur?',['İnanç esaslarını kalben doğrulamaktır.','Yalnızca toplumsal bir gruba katılmaktır.','Her konuda hiç soru sormamaktır.','Yalnızca sözlü bir iddiadan ibarettir.','Sadece gelenekleri tekrar etmektir.'],'İmanın özünde kalbin tasdiki bulunur; sözlü beyan bu kabulün dışa yansımasıdır.'],

['din','Allah’a ortak koşmadan, batıl inançlardan uzak durarak O’na yönelen kişi hangi kavramla nitelendirilir?',['Hanif','Münafık','Müşrik','Müsrif','Müfteri'],'Hanif, şirkten uzaklaşıp tek Allah’a yönelen kişidir; Hanefî ise bir fıkıh mezhebine mensubiyeti belirtir.'],

['din','Bir kimsenin Allah’a inanmakla birlikte başka varlıklara da ilahlık atfetmesi hangi kavramla ifade edilir?',['Şirk','Tevhit','İhlas','İhsan','Takva'],'Şirk, Allah’a ortak koşmaktır; tevhitle bağdaşmaz.'],

['din','Bir öğrenci sınava düzenli hazırlanıyor, elinden geleni yaptıktan sonra sonucu Allah’a bırakıyor. Bu tutum hangisine örnektir?',['Tevekkül','Tembellik','Kadercilik adına çabayı bırakma','Riya','İsraf'],'Tevekkül, gereken çabayı ve tedbiri gösterdikten sonra Allah’a güvenmektir.'],
['din','İslam inancında Allah’ın güzel isimlerini ifade eden kavram hangisidir?',['Esmâ-i hüsnâ','Efâl-i mükellefîn','Sünnetullah','Siyer','Esbâb-ı nüzûl'],'Esmâ-i hüsnâ, Allah’ı tanımaya yardımcı olan güzel isimlerdir.'],
['din','“İnsan, seçim yapabildiği için yaptıklarının sonuçlarını da üstlenmelidir.” Bu düşüncede hangi ilişki vurgulanır?',['Özgürlük ve sorumluluk','Servet ve itibar','Gelenek ve coğrafya','Ticaret ve üretim','Sanat ve mimari'],'Seçme imkânı, kişinin davranışları için hesap verme sorumluluğunu beraberinde getirir.'],
['ibadet','Bir kişi, bir iyiliği yalnızca Allah’ın rızasını gözeterek yapıyor. İbadette hangi temel ilke öne çıkmaktadır?',['İhlas','Riya','Gösteriş','Taassup','İsraf'],'İhlas, davranışın samimi biçimde Allah’ın rızası için yapılmasıdır.'],

['ibadet','Dinen yapılması kesin ve bağlayıcı biçimde emredilen davranış hangi kavramla adlandırılır?',['Farz','Mubah','Mekruh','Haram','Nafile'],'Farz, yerine getirilmesi kesin olarak istenen yükümlülüktür.'],

['ibadet','Dinen yapılması da yapılmaması da serbest bırakılan davranışlar hangi başlıkta yer alır?',['Mubah','Haram','Farz','Vacip','Mekruh'],'Mubah davranışlarda esas itibarıyla yapma veya yapmama serbestliği vardır.'],

['ibadet','Dinen yapılması kesin olarak yasaklanmış davranışın hükmü hangisidir?',['Haram','Mubah','Müstehap','Sünnet','Nafile'],'Haram, yapılmaması kesin biçimde istenen davranıştır.'],
['ibadet','Bir öğrencinin oruç tutarken kötü sözden ve haksızlıktan da uzak durması hangi sonucu gösterir?',['İbadetin ahlaki gelişimi desteklediğini','İbadetin yalnızca aç kalmak olduğunu','İbadette niyetin gereksizliğini','Ahlakın yalnızca dış görünüş olduğunu','İbadetin insan ilişkilerini etkilemediğini'],'İbadetin amaçlarından biri öz denetimi güçlendirmek ve davranışları güzelleştirmektir.'],

['ibadet','Bir kişi yardım yaparken “Beni herkes görsün ve övsün.” diye düşünüyor. Bu tutum ibadetin hangi yönünü zedeler?',['Samimiyetini','Yapıldığı yerin büyüklüğünü','Kullanılan eşyanın türünü','Yardım alanın yaşını','Günün saatini'],'İnsanların beğenisini temel amaç hâline getirmek riyadır ve ihlasla bağdaşmaz.'],
['ahlak','Bir genç kimse görmediğinde de kendisini Allah’ın gördüğünü düşünerek dürüst davranıyor. Hangi kavram öne çıkar?',['İhsan','Riya','Gıybet','İsraf','Haset'],'İhsan, Allah’ın huzurunda olduğu bilinciyle işini ve davranışını güzelleştirmektir.'],
['ahlak','Bir kimsenin bulunmadığı ortamda, duyduğunda hoşlanmayacağı gerçek bir kusurundan söz etmek hangi davranıştır?',['Gıybet','İftira','İstişare','İnfak','Tevazu'],'Gıybet, kişiyi arkasından hoşlanmayacağı şekilde anmaktır; asılsız bir suç yüklemek ise iftiradır.'],
['ahlak','İşlemediği bilinen bir suçu bir kişiye yüklemek hangi kavramla ifade edilir?',['İftira','Gıybet','Kanaat','İstişare','İhsan'],'İftira, gerçeğe aykırı bir isnatta bulunmaktır.'],
['ahlak','Kendi ihtiyacı bulunmasına rağmen arkadaşının ihtiyacını önceleyen kişinin davranışı hangi kavrama örnektir?',['İsar','İsraf','Haset','Kibir','Riya'],'İsar, başkasının ihtiyacını kendi ihtiyacına tercih edebilme erdemidir.'],
['ahlak','Birinin sahip olduğu imkânın ondan gitmesini istemeden, benzer bir iyiliğe sahip olmayı arzulamak hangisidir?',['Gıpta','Haset','İftira','Kibir','Gıybet'],'Gıptada başkasının nimetini kaybetmesi istenmez. Hasette ise bu nimetin yok olması arzulanır.'],
['ahlak','Bir yönetici görevi yakınına değil, işi en iyi yapabilecek kişiye veriyor. Hangi ilke öne çıkar?',['Liyakat','Kayırmacılık','İsraf','Taassup','Gösteriş'],'Liyakat, görevin ehil kişiye verilmesidir ve adaletin uygulanmasına katkı sağlar.'],
['ahlak','İnsanlarla ilişkilerinde kendini üstün görmeyen, başarılarıyla başkalarını küçümsemeyen kişinin özelliği hangisidir?',['Tevazu','Kibir','Haset','Riya','Taassup'],'Tevazu alçak gönüllülüktür; kişinin kendisini değersiz sayması anlamına gelmez.'],
['ahlak','Bir öğrenci ortak karardan önce arkadaşlarının görüşlerini alıyor. Bu davranış hangisine örnektir?',['İstişare','İsraf','İftira','Gıybet','Taassup'],'İstişare, karar verirken başkalarının bilgi ve görüşlerinden yararlanmaktır.'],
['ahlak','Tüketimde ihtiyacı aşmak ve kaynakları ölçüsüz kullanmak hangi kavramla ifade edilir?',['İsraf','Kanaat','İnfak','İsar','İktisat'],'İsraf, sahip olunan imkânların gereksiz ve ölçüsüz tüketilmesidir.'],
['ahlak','Bir kişinin kazancının bir kısmını Allah’ın rızasını gözeterek ihtiyaç sahipleriyle paylaşması hangi kavrama örnektir?',['İnfak','İhtikâr','Gıybet','Haset','Kibir'],'İnfak, kişinin malından veya imkânlarından hayır için harcamasıdır.'],
['vahiy','Hz. Muhammed’in vahyi insanlara ulaştırma görevi hangi kavramla ifade edilir?',['Tebliğ','Tebyin','Temsil','İçtihat','İcma'],'Tebliğ mesajı ulaştırma, tebyin ise bu mesajı açıklama görevidir.'],
['vahiy','Hz. Muhammed’in Kur’an’ın mesajını açıklaması ve anlaşılmasına yardımcı olması hangi görevidir?',['Tebyin','Tebliğ','Hicret','İcma','Kıyas'],'Tebyin, vahyin açıklanmasıdır; kavramın ayırt edici anlamı açıklığa kavuşturmaktır.'],
['vahiy','Hz. Muhammed’in bildirdiği ilkeleri kendi hayatında uygulayarak insanlara örnek olması hangi göreviyle ilişkilidir?',['Temsil','Tercüme','İcma','Kıraat','Tedvin'],'Temsil, dinî ilkeleri yaşayarak örneklik göstermektir.'],
['vahiy','Kur’an’da Hz. Muhammed için kullanılan “üsve-i hasene” ifadesinin anlamı hangisidir?',['Güzel örnek','Son kitap','İlk insan','Gizli haber','Ortak görüş'],'Üsve-i hasene, davranışlarıyla örnek alınacak güzel bir model olmayı ifade eder.'],
['vahiy','Peygamberlerin doğru sözlü olma özelliği hangi kavramdır?',['Sıdk','Emanet','Fetanet','Tebliğ','İsmet'],'Sıdk doğruluğu, emanet güvenilirliği, fetanet ise akıllı ve zeki olmayı anlatır.'],
['vahiy','Hz. Muhammed’in kendisine bırakılan eşyaları koruması ve sahiplerine geri vermesi hangi özelliğini örnekler?',['Emanet','Fetanet','İsmet','Hicret','Kıraat'],'Emanet, güvenilir olmaktır; verilen sözü tutmayı ve emanetleri korumayı kapsar.'],
['vahiy','Hz. Muhammed’in sözleri, davranışları ve onaylarının oluşturduğu örnek yol hangi kavramla ifade edilir?',['Sünnet','İcma','Kıyas','Mezhep','İçtihat'],'Sünnet, Hz. Peygamber’in söz, davranış ve onaylarıyla ortaya koyduğu örnekliği kapsar.'],
['vahiy','“Hatemü’l-enbiya” ifadesi Hz. Muhammed’in hangi özelliğini belirtir?',['Son peygamber olmasını','İlk insan olmasını','Melek olmasını','Yalnızca bir kavme gönderilmesini','Vahyi kendi düşüncesiyle oluşturmasını'],'Hatemü’l-enbiya, peygamberlerin sonuncusu demektir.'],
['vahiy','Hz. Muhammed’in yorulması, beslenmesi ve üzülmesi hangi yönüyle ilişkilidir?',['Beşerî yönüyle','Vahiy almasıyla','Tebliğ göreviyle','Son peygamber oluşuyla','Tebyin göreviyle'],'Beşerî yön, Hz. Muhammed’in diğer insanlar gibi insani ihtiyaçlara ve duygulara sahip olmasıdır.'],
['vahiy','Hz. Muhammed’in peygamberlik görevleri arasında “teşri” hangi anlamda kullanılır?',['Allah’ın verdiği yetkiyle dinî hüküm koyma','Vahyi insanlardan gizleme','Kur’an’ı başka bir kitaba dönüştürme','Yalnızca tarihî olayları kaydetme','Dini sadece kişisel beğeniye göre belirleme'],'Teşri, Hz. Peygamber’in vahyin rehberliğinde ve Allah’ın verdiği yetkiyle hüküm bildirmesini ifade eder.'],
['yorum','Tanrı’nın varlığını kabul ettiği hâlde vahyi ve peygamberliği reddeden yaklaşım hangisidir?',['Deizm','Teizm','Ateizm','Politeizm','Agnostisizm'],'Deizm yaratıcıyı kabul eder; vahiy ve peygamberlik kurumlarını benimsemez.'],
['yorum','Tanrı’nın varlığını reddeden yaklaşım hangisidir?',['Ateizm','Teizm','Deizm','Monoteizm','Politeizm'],'Ateizm tanrıtanımazlıktır. Deizm ise yaratıcıyı kabul ettiği için ateizmle aynı değildir.'],
['yorum','Tanrı’nın varlığı veya yokluğu hakkında kesin bilgiye ulaşılamayacağını savunan yaklaşım hangisidir?',['Agnostisizm','Monoteizm','Politeizm','Teizm','Deizm'],'Agnostisizm bilinemezcilik olarak adlandırılır; temel vurgu bilgiye ulaşmanın sınırındadır.'],
['yorum','Birden çok tanrının varlığını kabul eden inanç biçimi hangisidir?',['Politeizm','Monoteizm','Ateizm','Agnostisizm','Deizm'],'Politeizm çok tanrıcılık, monoteizm ise tek tanrıcılıktır.'],
['yorum','Varlığın yalnızca maddeden oluştuğunu savunan yaklaşım hangisidir?',['Materyalizm','Teizm','Monoteizm','Deizm','İdealizm'],'Materyalizm, maddeden bağımsız bir varlık alanını kabul etmeyen maddeci yaklaşımdır.'],
['yorum','İtikadi yorumlar öncelikle hangi alanla ilgilenir?',['İnanç esasları','Yalnızca mimari biçimler','Yalnızca yemek kültürü','Ticari ürünlerin fiyatı','Yazı sanatının kuralları'],'İtikat inançla ilgilidir. Fıkhi yorumlarda ise ibadet ve davranışlara ilişkin hükümler öne çıkar.'],
['yorum','Aşağıdakilerden hangisi fıkhi bir mezheptir?',['Hanefilik','Matüridilik','Eşarilik','Mevlevilik','Yesevilik'],'Hanefilik fıkhi; Matüridilik ve Eşarilik itikadi; Mevlevilik ve Yesevilik tasavvufi yorumlardır.'],

const KEY='din-rotasi-v1';
const fresh=()=>({points:0,answered:0,correct:0,rounds:0,bestStreak:0,mastered:[],mistakes:[],topics:{}});
let storageWorks=true;
function readProgress(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(!raw||typeof raw!=='object')return fresh();const out=fresh();for(const k of ['points','answered','correct','rounds','bestStreak'])out[k]=Number.isFinite(raw[k])&&raw[k]>=0?Math.floor(raw[k]):0;for(const k of ['mastered','mistakes'])out[k]=[...new Set(Array.isArray(raw[k])?raw[k].filter(id=>QUESTIONS.some(q=>q.id===id)):[])];for(const t of TOPICS){const v=raw.topics?.[t.id];if(v&&Number.isFinite(v.total)&&Number.isFinite(v.correct)&&v.total>=v.correct&&v.correct>=0)out.topics[t.id]={total:v.total,correct:v.correct};}return out;}catch{return fresh();}}
let progress=readProgress();let selectedTopic='all',selectedMode='learn',page='home',game=null,timer=null,pendingNav=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress));}catch{storageWorks=false;$('storage-notice').classList.remove('hidden');}updateHeader();}
try{localStorage.setItem(KEY,JSON.stringify(progress));}catch{storageWorks=false;$('storage-notice').classList.remove('hidden');}
function updateHeader(){$('total-points').textContent=progress.points.toLocaleString('tr-TR');$('mistake-count').textContent=progress.mistakes.length;document.querySelectorAll('[data-nav]').forEach(b=>{const active=b.dataset.nav===page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
function shuffle(array){const out=[...array];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
const topicBy=id=>TOPICS.find(t=>t.id===id);
function introduction(title,description,eyebrow='SIRA SENDE',right='TYT / DKAB'){return `<section class="intro"><div><div class="eyebrow">${eyebrow}</div><h1 tabindex="-1">${title}</h1><p>${description}</p></div><span class="edition">${right}</span></section>`;}
function setView(html,focus=false){$('view').innerHTML=html;updateHeader();if(focus){$('view').querySelector('h1,h2')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
function goHome(){stopTimer();game=null;page='home';renderHome();}
function renderHome(){const mastered=progress.mastered.length;setView(`${introduction('Bilgini oyuna dönüştür.','Konunu seç. Turunu tamamla. Her soruda biraz daha ilerle.')}<div class="workspace"><section class="panel setup"><div class="section-title"><span class="step">01</span><h2>Bugün hangi konudayız?</h2><small>${QUESTIONS.length} özgün soru</small></div><button class="all-topic ${selectedTopic==='all'?'selected':''}" data-action="topic" data-topic="all" aria-pressed="${selectedTopic==='all'}"><span class="topic-symbol">${icon('layers')}</span><span><strong>Karışık rota</strong><small>Tüm konulardan dengeli bir tur</small></span><span class="selection-dot" aria-hidden="true"></span></button><div class="topic-grid">${TOPICS.map(t=>`<button class="topic ${selectedTopic===t.id?'selected':''}" data-action="topic" data-topic="${t.id}" aria-pressed="${selectedTopic===t.id}"><span class="topic-symbol" style="background:${t.color}15;color:${t.color}">${icon(t.icon)}</span><span><strong>${t.title}</strong><small>${t.sub}</small></span><span class="selection-dot" aria-hidden="true"></span></button>`).join('')}</div><div class="mode-section"><div class="section-title"><span class="step">02</span><h2>Nasıl oynamak istersin?</h2></div><div class="mode-grid"><button class="mode ${selectedMode==='learn'?'selected':''}" data-action="mode" data-mode="learn" aria-pressed="${selectedMode==='learn'}">${icon('book')}<span><strong>Öğrenme turu</strong><small>Süresiz · Rahatça düşün</small></span></button><button class="mode ${selectedMode==='sprint'?'selected':''}" data-action="mode" data-mode="sprint" aria-pressed="${selectedMode==='sprint'}">${icon('spark')}<span><strong>Hızlı tur</strong><small>Her soru için 30 saniye</small></span></button></div></div><div class="start-row"><p class="start-meta"><strong>10 soru</strong> · 5 seçenek<br>Her yanıttan sonra açıklama</p><button class="primary" data-action="start">Oyuna başla ${icon('arrow')}</button></div></section><aside class="rail"><section class="panel progress-panel"><div class="rail-heading">Senin rotan ${icon('chart')}</div><div class="progress-ring" style="--angle:${mastered/QUESTIONS.length*360}deg"><div class="ring-center"><strong>${mastered}<span style="font-size:15px;color:#8a91a1;font-weight:450">/${QUESTIONS.length}</span></strong><small>pekişen soru</small></div></div><p class="rail-caption">Son denemende doğru yanıtladığın<br>farklı sorular</p><div class="stat-grid"><div><strong>${progress.rounds}</strong><small>Tamamlanan tur</small></div><div><strong>${progress.answered?Math.round(progress.correct/progress.answered*100)+'%':'—'}</strong><small>Doğru oranı</small></div></div></section><section class="challenge"><div class="challenge-label">${icon('target')} KÜÇÜK BİR HEDEF</div><h3>5 doğruyu<br>art arda bul.</h3><p>Her doğru 100 puan.<br>3. doğrudan itibaren<br>+20 seri puanı kazan.</p><div class="challenge-bar" aria-hidden="true">${Array.from({length:5},(_,i)=>`<i class="${progress.bestStreak>i?'done':''}"></i>`).join('')}</div><small>En iyi serin: ${progress.bestStreak} doğru</small></section><p class="hint">${icon('shield')}<span>Hesap açmana gerek yok. Gelişimin yalnızca bu tarayıcıda saklanır.</span></p></aside></div>`);}
function balancedQuestions(){const groups=shuffle(TOPICS).map(t=>shuffle(QUESTIONS.filter(q=>q.topic===t.id)));const out=[];while(out.length<10){for(const g of groups){if(g.length&&out.length<10)out.push(g.pop());}}return shuffle(out);}
function startGame(mode=selectedMode,topic=selectedTopic,ids=null){if(!['learn','sprint','review'].includes(mode)||!['all',...TOPICS.map(t=>t.id)].includes(topic))throw new Error('Geçersiz tur seçimi.');let pool=ids?shuffle(QUESTIONS.filter(q=>ids.includes(q.id))).slice(0,10):topic==='all'?balancedQuestions():shuffle(QUESTIONS.filter(q=>q.topic===topic)).slice(0,10);if(!pool.length){showMistakes();return;}stopTimer();game={mode,topic,questions:pool.map(q=>({...q,choices:shuffle(q.options.map((text,i)=>({text,correct:i===0})))})),index:0,answers:[],points:0,streak:0,best:0,answered:false,finished:false,deadline:0,remaining:30,paused:false};page='home';renderQuestion();}
function stopTimer(){if(timer!==null)clearInterval(timer);timer=null;}
function currentQuestion(){return game?.questions[game.index];}
function questionSource(q){return q.topic==='yorum'&&Number(q.id.slice(1))>55?'https://dogm.eba.gov.tr/etkilesimli/icerik/KarmaTestOnizle21460.html':topicBy(q.topic).source;}
function renderQuestion(){if(!game)return;stopTimer();game.answered=false;game.remaining=30;game.deadline=Date.now()+30000;const q=currentQuestion(),t=topicBy(q.topic);setView(`<div class="game-wrap animate-in"><div class="game-status"><button class="subtle-button" data-action="home">${icon('back')} Turdan çık</button><div class="game-chips"><span class="pill orange">${icon('spark')} <span id="round-points">${game.points}</span> puan</span><span class="pill" id="streak-chip">${icon('target')} <span id="round-streak">${game.streak}</span> seri</span>${game.mode==='sprint'?`<span class="pill" id="timer-chip">${icon('clock')} <span id="timer-value">30</span> sn</span>`:'<span class="pill">Süresiz</span>'}</div></div><section class="panel question-card"><div class="q-top"><span class="topic-tag">${t.title}</span><span>${game.mode==='review'?'Yanlışları pekiştir':game.mode==='sprint'?'Hızlı tur':'Öğrenme turu'}</span></div><div class="track" role="progressbar" aria-label="Tur ilerlemesi" aria-valuemin="0" aria-valuemax="${game.questions.length}" aria-valuenow="${game.index}"><div class="track-fill" style="width:${game.index/game.questions.length*100}%"></div></div><div class="question-number">SORU ${String(game.index+1).padStart(2,'0')} <span style="color:#b8bdc8">/ ${String(game.questions.length).padStart(2,'0')}</span></div><h1 tabindex="-1">${q.text}</h1><div class="answers" role="group" aria-label="Cevap seçenekleri">${q.choices.map((choice,i)=>`<button class="answer" data-action="answer" data-index="${i}"><span class="answer-letter">${'ABCDE'[i]}</span><span>${esc(choice.text)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="question-footer"><p class="keyboard"><kbd>1</kbd>–<kbd>5</kbd> veya <kbd>A</kbd>–<kbd>E</kbd> ile yanıtla.<br>Açıklamadan sonra <kbd>Enter</kbd> ile ilerle.</p><button class="primary" id="next-button" data-action="next" disabled>${game.index+1===game.questions.length?'Sonucu gör':'Sonraki soru'} ${icon('arrow')}</button></div></section></div>`,true);if(game.mode==='sprint')timer=setInterval(tick,200);}
function tick(){if(!game||game.mode!=='sprint'||game.answered||game.paused)return;const remaining=Math.max(0,Math.ceil((game.deadline-Date.now())/1000));game.remaining=remaining;if($('timer-value'))$('timer-value').textContent=remaining;$('timer-chip')?.classList.toggle('timer-low',remaining<=8);if(remaining===0)answer(-1);}
function answer(index){if(!game||game.answered||game.finished||game.paused)return;if(!Number.isInteger(index)||index< -1||index>4)return;if(game.mode==='sprint'&&Date.now()>=game.deadline)index=-1;stopTimer();game.answered=true;const q=currentQuestion();const correct=index>=0&&q.choices[index].correct;game.streak=correct?game.streak+1:0;game.best=Math.max(game.best,game.streak);const points=correct?100+(game.streak>=3?20:0):0;game.points+=points;game.answers.push({q,selected:index,correct,points});progress.answered++;progress.correct+=correct?1:0;progress.points+=points;progress.bestStreak=Math.max(progress.bestStreak,game.streak);const stats=progress.topics[q.topic]||{correct:0,total:0};stats.total++;stats.correct+=correct?1:0;progress.topics[q.topic]=stats;if(correct){progress.mistakes=progress.mistakes.filter(id=>id!==q.id);if(!progress.mastered.includes(q.id))progress.mastered.push(q.id);}else{if(!progress.mistakes.includes(q.id))progress.mistakes.push(q.id);progress.mastered=progress.mastered.filter(id=>id!==q.id);}save();document.querySelectorAll('.answer').forEach((el,i)=>{el.disabled=true;if(q.choices[i].correct){el.classList.add('correct');el.insertAdjacentHTML('beforeend','<span class="answer-mark">✓ Doğru</span>');}else if(i===index){el.classList.add('incorrect');el.insertAdjacentHTML('beforeend','<span class="answer-mark">✕</span>');}});$('round-points').textContent=game.points;$('round-streak').textContent=game.streak;if(index===-1&&$('timer-value'))$('timer-value').textContent='0';$('feedback').innerHTML=`<div class="feedback ${correct?'':'wrong'}"><strong>${correct?`Doğru cevap! +${points} puan${game.streak>=3?' · Seri bonusu':''}`:index===-1?'Süre doldu. Bu soruyu birlikte pekiştirelim.':'Bu soru tekrar listene eklendi.'}</strong><p>${esc(q.explanation)}</p><a href="${questionSource(q)}" target="_blank" rel="noopener noreferrer">Konunun MEB kaynağını incele ↗</a></div>`;$('next-button').disabled=false;}
function next(){if(!game||!game.answered||game.finished)return;if(game.index+1===game.questions.length)finish();else{game.index++;renderQuestion();}}
function finish(){if(!game||game.finished)return;stopTimer();game.finished=true;progress.rounds++;save();const correct=game.answers.filter(a=>a.correct).length;const wrong=game.answers.filter(a=>!a.correct);const percent=Math.round(correct/game.questions.length*100);setView(`<div class="game-wrap"><section class="panel result animate-in"><header class="result-header"><div class="result-medal">${icon('cup')}</div><div class="eyebrow">TUR TAMAMLANDI</div><h1 tabindex="-1">${percent===100?'Kusursuz bir tur!':percent>=70?'Güzel ilerliyorsun!':'Bir tur, yeni bir adım.'}</h1><p>${wrong.length?`${correct} doğru yanıt verdin. ${wrong.length} soruyu tekrar ederek konuyu pekiştirebilirsin.`:'Tüm soruları doğru yanıtladın. Yeni bir konuyla rotana devam et.'}</p></header><div class="scoreboard"><div><strong style="color:var(--orange)">${game.points}</strong><small>Kazanılan puan</small></div><div><strong>${correct}/${game.questions.length}</strong><small>Doğru yanıt</small></div><div><strong>%${percent}</strong><small>Doğru oranı</small></div><div><strong>${game.best}</strong><small>En uzun seri</small></div></div><div class="result-actions">${wrong.length?`<button class="primary" data-action="retry-round">${icon('repeat')} Bu yanlışları çöz</button>`:`<button class="primary" data-action="again">${icon('repeat')} Yeni tur oyna</button>`}<button class="secondary" data-action="home">Konu seçimine dön</button></div><h2 class="review-title">Turun cevap anahtarı</h2>${game.answers.map((a,i)=>`<details class="review-item"><summary><span style="color:${a.correct?'#16825f':'#bc6645'}">${a.correct?'✓':'↻'}</span> ${i+1}. ${esc(a.q.text)}</summary><p>Yanıtın: ${a.selected<0?'Süre doldu':esc(a.q.choices[a.selected].text)}</p><p class="right"><strong>Doğru cevap:</strong> ${esc(a.q.options[0])}</p><p>${esc(a.q.explanation)}</p></details>`).join('')}</section></div>`,true);}
function showMistakes(){stopTimer();game=null;page='mistakes';const items=QUESTIONS.filter(q=>progress.mistakes.includes(q.id));setView(`${introduction('Yanlışların, yeni fırsatların.','Tekrar et, nedenini öğren ve bu listeyi birlikte azaltalım.','PEKİŞTİRME ALANI',`${items.length} soru`)}${items.length?`<section class="panel mistake-list"><div class="section-title"><h2 tabindex="-1">${items.length} soru seni bekliyor.</h2></div><p>Her turda en fazla 10 soru. Doğru yanıtladığın sorular listeden çıkar. Bu turda süre sınırı yok.</p><button class="primary" data-action="review">Yanlışları çöz ${icon('arrow')}</button>${items.map(q=>`<details class="review-item"><summary>${esc(q.text)}</summary><p class="right"><strong>Doğru cevap:</strong> ${esc(q.options[0])}</p><p>${esc(q.explanation)}</p></details>`).join('')}</section>`:`<section class="panel empty">${icon('check')}<h2 tabindex="-1">Tekrar listen boş.</h2><p>Yanlış yanıtladığın ve süresini kaçırdığın sorular burada birikecek. Bir tur oynayarak başlayabilirsin.</p><button class="primary" data-action="home">Oyun alanına dön ${icon('arrow')}</button></section>`}`,true);}
function showProgress(){stopTimer();game=null;page='progress';setView(`${introduction('Adım adım gelişimin.','Bu tarayıcıdaki tüm turlarının toplamı.','SENİN ROTAN')}<section class="panel result"><div class="scoreboard"><div><strong>${progress.answered}</strong><small>Yanıtlanan soru</small></div><div><strong>${progress.correct}</strong><small>Doğru yanıt</small></div><div><strong>${progress.rounds}</strong><small>Tamamlanan tur</small></div><div><strong>${progress.points}</strong><small>Toplam puan</small></div></div><p class="start-meta">Aynı soru tekrar çözüldüğünde toplam yanıtlara yeniden eklenir. Bu göstergeler çalışma içindir; bir sınav puanı veya sıralama değildir.</p></section><section class="panel progress-list"><h2 style="font-size:18px">Konu konu durumun</h2>${TOPICS.map(t=>{const st=progress.topics[t.id]||{total:0,correct:0},pct=st.total?Math.round(st.correct/st.total*100):0;return `<div class="topic-progress"><span class="topic-symbol" style="color:${t.color};background:${t.color}15">${icon(t.icon)}</span><div class="info"><h3>${t.title}</h3><small>${st.total?`${st.correct} / ${st.total} doğru · %${pct}`:'Henüz soru çözülmedi'}</small><div class="track"><div class="track-fill" style="width:${pct}%;background:${t.color}"></div></div></div><button class="subtle-button" data-action="practice-topic" data-topic="${t.id}">Çalış ${icon('arrow')}</button></div>`;}).join('')}</section><p class="hint" style="margin-top:14px">${icon('shield')}Veriler yalnızca bu cihazın bu tarayıcısında saklanır. Başka cihazlara aktarılmaz; tarayıcı verileri temizlenirse silinir.</p>`,true);}

function sources(){openDialog(`<h2 id="dialog-title">Kaynaklar & oyun bilgisi</h2><p>Bu sürüm, TYT DKAB hazırlığı için 6 konu grubunda 60 özgün alıştırma içerir. Sorular çıkmış ÖSYM soruları değildir; tüm TYT kapsamını tamamlayan bir soru bankası olarak sunulmaz.</p><p>Kavramlar MEB’in ders ve konu anlatım kaynaklarıyla kontrol edilmiştir. Konu grupları çalışma kolaylığı içindir; güncel sınıf/ünite sırası iddiası taşımaz.</p><ul><li><a href="https://ogmmateryal.eba.gov.tr/yks-konu-anlatim?d=0&k=0&kod=DIN&s=0&u=0" target="_blank" rel="noopener noreferrer">OGM Materyal · YKS konu anlatımları</a></li>${TOPICS.map(t=>`<li><a href="${t.source}" target="_blank" rel="noopener noreferrer">${t.title} · MEB kaynağı</a></li>`).join('')}<li><a href="https://dogm.eba.gov.tr/etkilesimli/icerik/KarmaTestOnizle21460.html" target="_blank" rel="noopener noreferrer">Dinî yorumlar · MEB 10. sınıf</a></li></ul><p>Her doğru 100 puan; aynı turda 3. ve sonraki ardışık doğrular +20 puan kazandırır. Yanlışlar puan düşürmez. Hızlı turda her soru 30 saniyedir; sekme değiştirildiğinde süre devam eder.</p><p>Hesap, isim veya iletişim bilgisi istenmez. Oyun gelişimi sadece bu tarayıcıda tutulur. Sayfa yenilenirse mevcut tur kapanır; verilmiş yanıtların kaydı korunur.</p><div class="actions"><button class="primary" data-action="close-dialog">Tamam</button></div>`);}
function navigate(action){if(game&&!game.finished){game.paused=true;game.remaining=game.mode==='sprint'?Math.max(0,game.deadline-Date.now()):0;stopTimer();pendingNav=action;openDialog('<h2 id="dialog-title">Turdan ayrılmak istiyor musun?</h2><p>Şimdiye kadar verdiğin yanıtlar ve kazandığın puanlar korunur. Yarım kalan tur, tamamlanan turlara eklenmez.</p><div class="actions"><button class="secondary" data-action="cancel-exit">Tura devam et</button><button class="primary" data-action="confirm-exit">Turdan ayrıl</button></div>');return;}runNavigation(action);}
function runNavigation(action){if(action==='home')goHome();else if(action==='mistakes')showMistakes();else if(action==='progress')showProgress();}
function resume(){pendingNav=null;if(game&&!game.finished){game.paused=false;if(game.mode==='sprint'&&!game.answered){game.deadline=Date.now()+game.remaining;timer=setInterval(tick,200);}}}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(['home','mistakes','progress'].includes(action)){navigate(action);return;}if(action==='topic'){selectedTopic=b.dataset.topic;renderHome();}else if(action==='mode'){selectedMode=b.dataset.mode;renderHome();}else if(action==='start')startGame();else if(action==='answer')answer(Number(b.dataset.index));else if(action==='next')next();else if(action==='again')startGame(game.mode,game.topic);else if(action==='retry-round'){const ids=game.answers.filter(a=>!a.correct).map(a=>a.q.id);startGame('review','all',ids);}else if(action==='review')startGame('review','all',progress.mistakes);else if(action==='practice-topic')startGame('learn',b.dataset.topic);else if(action==='sources')sources();else if(action==='close-dialog')$('info-dialog').close();else if(action==='cancel-exit'){$('info-dialog').close();resume();}else if(action==='confirm-exit'){const target=pendingNav;pendingNav=null;$('info-dialog').close();runNavigation(target);}});
$('info-dialog').addEventListener('cancel',()=>{if(pendingNav)resume();});
document.addEventListener('keydown',event=>{if(!game||game.finished||game.paused||$('info-dialog').open||event.ctrlKey||event.metaKey||event.altKey||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||event.repeat)return;if(event.key==='Enter'&&game.answered){event.preventDefault();next();return;}const key=event.key.toUpperCase();const index=/^[1-5]$/.test(key)?Number(key)-1:'ABCDE'.indexOf(key);if(key.length===1&&index>=0&&!game.answered){event.preventDefault();answer(index);}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
window.addEventListener('pagehide',stopTimer);
window.addEventListener('pageshow',event=>{if(event.persisted&&game&&!game.answered&&!game.paused&&game.mode==='sprint'){tick();if(!game.answered)timer=setInterval(tick,200);}});
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
renderHome();
// Optional browser-native agent support. Unsupported browsers keep the same UI.
const modelContext=document.modelContext;
if(modelContext?.registerTool){try{Promise.resolve(modelContext.registerTool({name:'start_dkab_practice',title:'DKAB öğrenme turu başlat',description:'Seçilen konuda yeni, süresiz bir öğrenme turu başlatır. Devam eden tur varsa değiştirmez.',inputSchema:{type:'object',properties:{topic:{type:'string',enum:['all',...TOPICS.map(t=>t.id)]}},required:['topic'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length!==1||!['all',...TOPICS.map(t=>t.id)].includes(input.topic))throw new Error('Geçersiz konu.');if(game&&!game.finished)throw new Error('Önce mevcut turu tamamlayın.');if($('info-dialog').open)throw new Error('Önce açık pencereyi kapatın.');startGame('learn',input.topic);return {started:true,topic:input.topic,questionCount:game.questions.length};}})).catch(()=>{});}catch{/* Browser support is optional. */}}
</script></body></html>
